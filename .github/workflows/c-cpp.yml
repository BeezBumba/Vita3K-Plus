name: Build Linux ARM64
on:
  push:
    branches:
      - master
      - all-enhancements # Enables tracking on your feature branch
    paths-ignore:
      - '**.md'
  pull_request:
    branches:
      - master
      - all-enhancements # Enables tracking on pull requests targeting your branch
    paths-ignore:
      - '**.md'
  workflow_dispatch: # Keeps manual triggers active across any branch selection

env:
  BUILD_CONFIG: Release
  QT_VERSION: '6.11.0'
  SCCACHE_GHA_ENABLED: "true"
  SCCACHE_GHA_FALLBACK_ON_ERROR: "true"

jobs:
  desktop-build:
    name: Desktop (linux-arm64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up build environment (Linux)
        run: bash ./.ci/setup-linux.sh aarch64 with-appimage

      - uses: mozilla-actions/sccache-action@v0.0.7
        with:
          disable_annotations: true

      - name: Install Qt 6.11.0
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtmultimedia
          cache: true
          install-deps: 'true'

      - name: Build desktop target (Linux ARM64)
        env:
          VITA3K_LINUXDEPLOY_COMMAND: /usr/local/bin/linuxdeploy-aarch64.AppImage
        run: bash ./.ci/build-desktop.sh --preset ci-linux-clang-appimage --config ${{ env.BUILD_CONFIG }}

      - name: Compute artifact paths
        shell: bash
        run: |
          echo "ARTIFACT_NAME=vita3k-$(git rev-parse --short HEAD)-linux-arm64" >> "$GITHUB_ENV"
          echo "ARTIFACT_DIR=artifacts/vita3k-$(git rev-parse --short HEAD)-linux-arm64" >> "$GITHUB_ENV"

      - name: Stage desktop artifact (Linux ARM64)
        run: bash ./.ci/package-desktop.sh --platform linux-arm64 --preset ci-linux-clang-appimage --config ${{ env.BUILD_CONFIG }} --output-dir "${{ env.ARTIFACT_DIR }}"

      - name: Print sccache statistics
        run: sccache --show-stats

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_DIR }}
